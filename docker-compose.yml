version: "3.8"

services:
  backend:
    build: .
    container_name: task-chunk-timer-backend
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - NODE_ENV=${NODE_ENV}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: task-chunk-timer-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      - NODE_ENV=development
    ports:
      - "3000:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
    restart: unless-stopped